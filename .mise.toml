[tools]
# =================================================================================================
# Project Tools -> pinned versions
# =================================================================================================
go = "1.27.2"
golangci-lint = "2.15.0"
"github:goreleaser/goreleaser" = "v2.18.3"
"aqua:siderolabs/talos" = "1.14.4"
sops = "3.13.3"

# =================================================================================================
# Misc Tools
# =================================================================================================
direnv = "latest"

# =================================================================================================
# CI Tools
# =================================================================================================
"aqua:rhysd/actionlint" = "1"
"shellcheck" = "0.11"
"ubi:caarlos0/svu" = "latest"

# =================================================================================================
# TASKS
# =================================================================================================
[tasks."release"]
description = "Run goreleaser in snapshot mode."
run = "goreleaser release --snapshot --clean"

[tasks."lint"]
description = "Run golangci-lint in fix mode."
run = "golangci-lint run --fix"

[tasks."test"]
description = "Run tests."
run = "bash scripts/test.sh"
