---
apiVersion: config.talstomize.dev/v1alpha1
kind: Talstomize

clusterName: home-cluster
controlPlaneEndpoint: https://10.5.0.2:6443
secrets: ./talos-secrets.yaml

# Cluster-wide default; nodea overrides it below (e.g. for a custom
# Image Factory schematic that only that node needs).
installer:
  image: ghcr.io/siderolabs/installer:v1.9.5

nodes:
  nodea:
    ip: 10.5.0.11
    kind: controlplane
    installer:
      image: factory.talos.dev/metal-installer/abc123:v1.9.5
    patches:
      - ./patches/nodea-disk.yaml
  nodeb:
    ip: 10.5.0.12
    kind: worker
    patches:
      - machine:
          kubelet:
            extraMounts:
              - destination: /var/lib/longhorn
                type: bind
                source: /var/lib/longhorn
                options: ["bind", "rshared", "rw"]

patches:
  - machine:
      sysctls:
        net.core.somaxconn: "1024"

controlplanePatches:
  - ./patches/controlplane-common.yaml

workerPatches: []
