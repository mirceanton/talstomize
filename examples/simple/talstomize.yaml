---
apiVersion: config.talstomize.dev/v1alpha1
kind: Talstomize

clusterName: home-cluster
controlPlaneEndpoint: https://10.5.0.2:6443
secrets: ./talos-secrets.yaml

# Every node runs this Talos version; it also selects the config style generated.
talosVersion: v1.14.2

# Cluster-wide installer default (vanilla when unset); nodea overrides it below
# with an Image Factory schematic that only that node needs.
installer:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/iscsi-tools

nodes:
  nodea:
    ip: 10.5.0.11
    kind: controlplane
    installer:
      schematic:
        customization:
          systemExtensions:
            officialExtensions:
              - siderolabs/iscsi-tools
              - siderolabs/zfs
    patches:
      - ./patches/nodea-disk.yaml
  nodeb:
    ip: 10.5.0.12
    kind: worker
    patches:
      - apiVersion: v1alpha1
        kind: UnattendedInstallConfig
        provisioning:
          diskSelector:
            match: disk.dev_path == "/dev/nvme0n1"
      - apiVersion: v1alpha1
        kind: TimeSyncConfig
        ntp:
          servers:
            - time.cloudflare.com

patches:
  - apiVersion: v1alpha1
    kind: SysctlConfig
    params:
      net.core.somaxconn: "1024"

controlplanePatches:
  - ./patches/controlplane-common.yaml

workerPatches: []
